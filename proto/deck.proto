syntax = "proto3";

package types;

option go_package = "github.com/Fankhauserli/voabkr-backend/types";

message Deck {
  // @gotags: json:"id"
  uint32 id = 1 [json_name = "id"];
  // @gotags: json:"name"
  string name = 2 [json_name = "name"];
  // @gotags: json:"type"
  string type = 3 [json_name = "type"];
}

message DeckRequest {
  // @gotags: json:"name"
  string name = 1 [json_name = "name"];
  // @gotags: json:"type"
  string type = 2 [json_name = "type"];
}

message DeckList {
  // @gotags: json:"decks"
  repeated Deck decks = 1 [json_name = "decks"];
}

