syntax = "proto3";

package types;

option go_package = "github.com/Fankhauserli/voabkr-backend/types";

message Deck {
  // @gotags: json:"id"
  uint32 id = 1 [json_name = "id"];
  // @gotags: json:"name"
  string name = 2 [json_name = "name"];
  // @gotags: json:"type"
  string type = 3 [json_name = "type"];
  // @gotags: json:"ownerId,omitempty"
  uint32 owner_id = 4 [json_name = "ownerId"];
  // @gotags: json:"isPublic"
  bool is_public = 5 [json_name = "isPublic"];
  // @gotags: json:"shareToken,omitempty"
  string share_token = 6 [json_name = "shareToken"];
  // @gotags: json:"userAccessRole,omitempty"
  string user_access_role = 7 [json_name = "userAccessRole"];
}

message DeckRequest {
  // @gotags: json:"name"
  string name = 1 [json_name = "name"];
  // @gotags: json:"type"
  string type = 2 [json_name = "type"];
  // @gotags: json:"isPublic"
  bool is_public = 3 [json_name = "isPublic"];
}

message DeckList {
  // @gotags: json:"decks"
  repeated Deck decks = 1 [json_name = "decks"];
}

message ShareDeckRequest {
  // @gotags: json:"email,omitempty"
  string email = 1 [json_name = "email"];
  // @gotags: json:"permission,omitempty"
  string permission = 2 [json_name = "permission"];
}

message DeckShareResponse {
  // @gotags: json:"shareToken,omitempty"
  string share_token = 1 [json_name = "shareToken"];
  // @gotags: json:"message,omitempty"
  string message = 2 [json_name = "message"];
}
