syntax = "proto3";

package types;

option go_package = "github.com/Fankhauserli/voabkr-backend/types";

message Card {
  // @gotags: json:"id"
  uint32 id = 1 [json_name = "id"];
  // @gotags: json:"deckId"
  uint32 deck_id = 2 [json_name = "deckId"];
  // @gotags: json:"koreanWord"
  string korean_word = 3 [json_name = "koreanWord"];
  // @gotags: json:"englishWord"
  string english_word = 4 [json_name = "englishWord"];
  // @gotags: json:"context"
  string context = 5 [json_name = "context"];
  // @gotags: json:"example"
  string example = 6 [json_name = "example"];
}

message CardRequest {
  // @gotags: json:"deckId"
  uint32 deck_id = 1 [json_name = "deckId"];
  // @gotags: json:"koreanWord"
  string korean_word = 2 [json_name = "koreanWord"];
  // @gotags: json:"englishWord"
  string english_word = 3 [json_name = "englishWord"];
  // @gotags: json:"context"
  string context = 4 [json_name = "context"];
  // @gotags: json:"example"
  string example = 5 [json_name = "example"];
}

message CardList {
  // @gotags: json:"cards"
  repeated Card cards = 1 [json_name = "cards"];
}

