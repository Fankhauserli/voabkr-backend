# This workflow will build a golang project
# For more information see: https://docs.github.com/en/actions/automating-builds-and-tests/building-and-testing-go

name: Go

on:
  push:
    branches: [ "main" ]
    tags: [ "*" ]
  pull_request:
    branches: [ "main" ]

env:
  REGISTRY: ghcr.io
  IMAGE_NAME: "fankhauserli/voabkr-backend"

jobs:

  build:
    runs-on: ubuntu-latest
    steps:
    - uses: actions/checkout@v4

    - name: Set up Go
      uses: actions/setup-go@v4
      with:
        go-version: '1.27'

    - name: Determine and bump version
      id: versioning
      run: |
        set -euo pipefail

        package="${GITHUB_REPOSITORY##*/}"
        versions=$(
          {
            git ls-remote --tags --refs origin \
              | awk -F/ '{print $3}'
            gh api --paginate "/user/packages/container/${package}/versions" 2>/dev/null \
              | jq -r '.[].metadata.container.tags[]?' 2>/dev/null || true
          } \
            | sed -E 's/^v//' \
            | grep -E '^[0-9]+\.[0-9]+\.[0-9]+(-pre\.[0-9]+)?$' \
            | sort -V -u || true
        )

        latest=$(printf '%s\n' "${versions}" | tail -n 1)
        if [[ "${GITHUB_REF_TYPE:-}" == "tag" ]]; then
          next="${GITHUB_REF_NAME#v}"
          next="${next%%-pre.*}"
        elif [[ -z "${latest}" ]]; then
          next="0.1.0-pre.1"
        elif [[ "${latest}" =~ ^([0-9]+)\.([0-9]+)\.([0-9]+)-pre\.([0-9]+)$ ]]; then
          next="${BASH_REMATCH[1]}.${BASH_REMATCH[2]}.${BASH_REMATCH[3]}-pre.$((BASH_REMATCH[4] + 1))"
        else
          next="${latest}-pre.1"
        fi

        echo "tag=${next}" >> "${GITHUB_OUTPUT}"
        echo "Using version ${next}"
        

    - name: build sqlc
      run: |
        go install github.com/sqlc-dev/sqlc/cmd/sqlc@latest
        cd sql
        sqlc generate
        cd ..

    - name: Build
      run: go build -v ./...

    - name: Test
      run: go test -v ./...

    - name: Set up Docker Buildx
      uses: docker/setup-buildx-action@v3

    - name: Log in to GitHub Container Registry
      if: github.event_name != 'pull_request'
      uses: docker/login-action@v3
      with:
        registry: ${{ env.REGISTRY }}
        username: ${{ github.actor }}
        password: ${{ secrets.GITHUB_TOKEN }}

    - name: Build and push Docker image
      uses: docker/build-push-action@v6
      with:
        file: ./Dockerfile
        push: ${{ github.event_name != 'pull_request' }}
        tags: |
          ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}:${{ steps.versioning.outputs.tag }}
          ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}:latest
        cache-from: type=gha
        cache-to: type=gha,mode=max
