# This workflow will build a golang project
# For more information see: https://docs.github.com/en/actions/automating-builds-and-tests/building-and-testing-go

name: Go

on:
  push:
    branches: ["main"]
    tags: ["*"]
  pull_request:
    branches: ["main"]

env:
  REGISTRY: ghcr.io
  IMAGE_NAME: "fankhauserli/voabkr-backend/voabkr-backend"

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: write
      packages: write

    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version: "1.24"

      - name: Determine and bump version
        id: versioning
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail

          package="${GITHUB_REPOSITORY##*/}"
          owner="${GITHUB_REPOSITORY_OWNER}"

          # Aggregate tags from git refs and GitHub container package registry
          versions=$(
            {
              git ls-remote --tags --refs origin 2>/dev/null \
                | awk -F/ '{print $3}'
              git tag -l 2>/dev/null || true
              gh api --paginate "/users/${owner}/packages/container/${package}/versions" 2>/dev/null \
                | jq -r '.[].metadata.container.tags[]?' 2>/dev/null || true
            } \
              | sed -E 's/^v//' \
              | grep -E '^[0-9]+\.[0-9]+\.[0-9]+(-pre\.[0-9]+)?$' \
              | sort -V -u || true
          )

          latest=$(printf '%s\n' "${versions}" | tail -n 1)
          if [[ "${GITHUB_REF_TYPE:-}" == "tag" ]]; then
            next="${GITHUB_REF_NAME#v}"
            next="${next%%-pre.*}"
          elif [[ -z "${latest}" ]]; then
            next="0.1.0-pre.1"
          elif [[ "${latest}" =~ ^([0-9]+)\.([0-9]+)\.([0-9]+)-pre\.([0-9]+)$ ]]; then
            next="${BASH_REMATCH[1]}.${BASH_REMATCH[2]}.${BASH_REMATCH[3]}-pre.$((BASH_REMATCH[4] + 1))"
          elif [[ "${latest}" =~ ^([0-9]+)\.([0-9]+)\.([0-9]+)$ ]]; then
            next="${BASH_REMATCH[1]}.${BASH_REMATCH[2]}.$((BASH_REMATCH[3] + 1))-pre.1"
          else
            next="${latest}-pre.1"
          fi

          echo "tag=${next}" >> "${GITHUB_OUTPUT}"
          echo "version=${next}" >> "${GITHUB_OUTPUT}"
          echo "Using version ${next}"

      - name: Generate code (sqlc & protobuf)
        run: |
          sudo apt-get update && sudo apt-get install -y protobuf-compiler
          go install github.com/sqlc-dev/sqlc/cmd/sqlc@latest
          go install google.golang.org/protobuf/cmd/protoc-gen-go@latest
          go install github.com/mitchellh/protoc-gen-go-json@latest
          go install github.com/favadi/protoc-go-inject-tag@latest
          cd sql
          sqlc generate
          cd ..
          go generate ./...

      - name: Build
        run: go build -v ./...

      - name: Test
        run: go test -v ./...

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to GitHub Container Registry
        if: github.event_name != 'pull_request'
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and push Docker image
        uses: docker/build-push-action@v6
        with:
          file: ./Dockerfile
          push: ${{ github.event_name != 'pull_request' }}
          tags: |
            ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}:${{ steps.versioning.outputs.tag }}
            ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}:latest
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Create and push Git tag
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        run: |
          next="${{ steps.versioning.outputs.tag }}"
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          if ! git rev-parse "v${next}" >/dev/null 2>&1; then
            git tag "v${next}"
            git push origin "v${next}" || true
            echo "✅ Created and pushed git tag v${next}"
          fi
